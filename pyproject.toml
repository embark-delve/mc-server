[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "minecraft-server-manager"
version = "2.0.0"
description = "Safe local Minecraft Forge server management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0.3,<7",
    "rich>=13.9,<16",
    "starlette>=0.49,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
minecraft-server = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "mypy>=1.15,<3",
    "types-PyYAML>=6.0",
    "pip-audit>=2.9,<3",
    "httpx>=0.28,<1",
    "pre-commit>=4,<5",
    "pre-commit-hooks>=6,<7",
    "bandit[toml]>=1.8,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["docs", ".specstory", "*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S106", "S104", "S108"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["docs", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a running Docker engine and network access"]

[tool.bandit]
exclude_dirs = ["tests", "docs", ".venv", ".tools"]
