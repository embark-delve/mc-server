name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Install uv
        run: python -m pip install uv==0.5.21
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: uv run pre-commit run --all-files
      - run: uv run pre-commit run --all-files --hook-stage pre-push
      - run: gitleaks git --redact --no-banner
      - run: uv build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv /tmp/mc-wheel
          /tmp/mc-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/mc-wheel/bin/minecraft-server --help
